<!-- Assignment 01: Age Calculator

Technology: HTML, CSS, JavaScript (DOM)

Problem Statement:

Create an Age Calculator application using HTML, CSS, and JavaScript.

Requirements:

Accept Date of Birth using a date input field.

Add a Calculate Age button.

Calculate and display age in Years, Months, and Days.

Display the result dynamically without reloading the page.

Validate empty input and future dates.

Design a simple and user-friendly interface. -->





<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    Enter DOB:
    <input type="date" name="" id="dob">
    <span id="error" style="color: red;"></span>
    <br><br>
    <span id="result"></span>
    <br><br>
    <button id="btn">Calculate Age</button>

    <script>
        document.getElementById("btn").addEventListener("click", function(){
            let userdob = document.getElementById("dob").value
            let result = document.getElementById("result")
            let error = document.getElementById("error")
            let now = new Date()
            let dob = new Date(userdob)
            if (userdob === ""){
                error.textContent = "plz Enter date of birth first"
                result.textContent = ""
            }
            else if (dob > now){
                error.textContent = "Future date is not allowed"
                result.textContent = ""
            }
            else {
                error.textContent = ""
                result.textContent = `your age is ${(now.getFullYear() - dob.getFullYear())} years`
            }
        })
    </script>

</body>

</html>
