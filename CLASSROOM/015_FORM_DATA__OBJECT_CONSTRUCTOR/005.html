<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let obj = {
            name:"deepika",
            address:"chennai",
            display:function(){
                console.log("this is display function")
                console.log("Name inside display", this.name)
                console.log("Address inside display is ",this.address)
            }
        }
        console.log(obj)
        console.log(obj.name)
        obj.display()

        for( let x in obj){
            console.log(x, obj[x])
        }
    </script>
</body>
</html>
