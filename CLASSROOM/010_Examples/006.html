<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Price:</label>
    <input type="number" id="p">
    <label>Quantity:</label>
    <input type="number" id="q" min="1">
    <h3 id="total"></h3>

    <script>
        function calculate(){
            let price = document.getElementById("p").value
            let quantity = document.getElementById("q").value
            document.getElementById("total").textContent = "TOTAL "+ (price * quantity)
        }

        document.getElementById("p").addEventListener("input", calculate)
        document.getElementById("q").addEventListener("input", calculate)
    </script>
</body>
</html>
