    <script>
        console.log("code started")

        function checkpayment(){
            return new Promise((resolve, reject)=>{
                setTimeout(()=>{
                    reject("payment fail")
                }, 1000)
            })
        }

        async function processPayment() {
            try{
                let result = await checkpayment()
                console.log(result)
                console.log("order confirmed")
            }            
            catch(e)
            {
                console.log("Error", e)
            }
        }

        processPayment()


        console.log("next processing")

        // code started

    </script>
