<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img id="img1" src="nature.jpg"  alt="image not found">

    <script>
        let m = document.getElementById("img1")
        console.log(m.getAttribute("src"))  //  nature.jpg

        console.log(m.getAttribute("alt"))  //  image not found

        m.setAttribute("alt", "profile picture")

        m.setAttribute("src", "another.jpg")

        console.log(m.getAttribute("src"))  //  another.jpg

        console.log(m.getAttribute("alt"))  //  profile picture

    </script>
</body>
</html>
