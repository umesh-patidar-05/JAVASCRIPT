<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="heading">JAVA SCRIPT DOM</h2>
    <p id="message">This paragraph will be removed</p>
    <button id="removebtn">Remove para</button>
    
    <script>
        let message = document.getElementById("message")
        document.getElementById("removebtn").addEventListener("click", function(){
            message.remove()
        })
    </script>
</body>
</html>
