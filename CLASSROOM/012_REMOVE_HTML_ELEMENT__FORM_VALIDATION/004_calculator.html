<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h2>Basic calculator</h2>
    <input type="number" name="" id="num1"  placeholder="Enter first number">
    <br>
    <input type="number" name="" id="num2"  placeholder="Enter Second number">
    <br><br>
    <button onclick="add()">Addition(+)</button>
    <button onclick="subtract()">Substraction(-)</button>
    <button onclick="multiply()">Multiplication(*)</button>
    <button onclick="divide()">Division(/)</button>
    <h3 id="result"></h3>

    <script>
        function add(){
            let a = Number(document.getElementById("num1").value)
            let b = Number(document.getElementById("num2").value)
            document.getElementById("result").innerHTML = a+b
        }

        function subtract(){
            let a = Number(document.getElementById("num1").value)
            let b = Number(document.getElementById("num2").value)
            document.getElementById("result").innerHTML = a-b
        }

        function multiply(){
            let a = Number(document.getElementById("num1").value)
            let b = Number(document.getElementById("num2").value)
            document.getElementById("result").innerHTML = a*b
        }

        function divide(){
            let a = Number(document.getElementById("num1").value)
            let b = Number(document.getElementById("num2").value)
            document.getElementById("result").innerHTML = a/b
        }

    </script>
</body>
</html>
